name: TechStore CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Start Database and RabbitMQ
      run: |
        docker compose up -d postgres-product postgres-order rabbitmq
        echo "Waiting for services to be ready..."
        sleep 15

    - name: Build and Test Spring Boot Services
      run: mvn clean package -DskipTests

    - name: Set up Node.js for Angular
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build Angular Frontend
      working-directory: ./angular-frontend
      run: |
        npm install
        npm run build --configuration=production

    - name: Stop Docker Services
      if: always()
      run: docker compose down
